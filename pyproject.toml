[project]
name = "corpus-generalization"
version = "0.1.0"
description = "Graph-topology indicators of whether a training corpus holds the patterns a language model needs to generalize a knowledge domain."
authors = [{ name = "marcofura", email = "mjfura27@gmail.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "numpy (>=2.5.2,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "neo4j (>=6.3.1,<7.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "torch (>=2.14,<3.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "spacy (>=3.8.16,<4.0.0)",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastcluster (>=1.3.0,<2.0.0)",
]

[project.scripts]
corpus-analyze = "corpus_generalization.analyze:main"
corpus-diagnose = "corpus_generalization.diagnose:main"
corpus-train = "corpus_generalization.model.train:main"
corpus-generate = "corpus_generalization.model.generate:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.4,<0.17",
    "mypy>=2.3.1,<3",
    "types-networkx>=3.6.1.20260911,<4",
]

[tool.uv]
# Windows can't resolve: torch 2.14 pins CUDA libraries that conflict there.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["corpus_generalization"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true

# None ship type information; `corpus_generalization.analysis` (and `analyze.py` for `datasets`)
# wrap them and type what they hand on.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "sentence_transformers.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
